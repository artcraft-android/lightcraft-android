[package]
name = "lightcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightCraft on phones: the engine as a native library with Kotlin bindings (UniFFI); the Android app is in android/"

[lib]
name = "lightcraft_android"
# cdylib: the library the Android app loads; lib: the tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
lightcraft-engine = { workspace = true }
# the cloud library: a PC's published photos on an rclone remote (rclone's own library, loaded at run time)
lightcraft-cloud-client = { workspace = true }
# the view ↔ photo mapping (an affine) for the tools that act on the photo
lightcraft-geom = { workspace = true }
# the point curves' spline, for the Curve tool to draw them as the engine applies them
lightcraft-color = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# MPL-2.0, pure Rust. The exact version: the Kotlin bindings are generated by the same release
# (bindgen/, a workspace member sharing this lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }

# the engine's log in logcat (pure Rust; links the system's liblog)
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
