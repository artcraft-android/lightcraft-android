[package]
name = "lightcraft-cloud-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client of a LightCraft cloud library (the rclone remote `lc-cloud` publishes): thumbnails, smart previews, edits back. App-agnostic: any app plugs its engine in."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# rclone's librclone, loaded at run time (ISC)
libloading = "0.8"

[dev-dependencies]
lightcraft-engine = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-meta = { workspace = true }
